</style></head><body><div id="loginOverlay" class="login-overlay"><form id="loginForm" class="login-card"><img src="hyundai_logo.png" alt="현대자동차 로고" onerror="this.style.display='none'"><h2>HYUNDAI CONNECT</h2><p>사내 커뮤니케이션 플랫폼</p><label for="loginId">사용자 아이디</label><input id="loginId" autocomplete="username" value="blh0615" required><div id="loginError" class="login-error" aria-live="polite"></div><button type="submit">로그인</button><div class="project">개인 프로젝트</div></form></div><div class="app"><aside class="side"><header class="brand"><div class="brand-logo"><img src="hyundai_logo.png" alt="현대자동차 로고" onerror="this.style.display='none'"></div><div class="brand-info"><h1>HYUNDAI CONNECT</h1><small>자율주행자동차 설계팀</small></div></header><div class="profile"><strong>백인헌</strong>연구원 · 자율주행 설계</div><nav id="rooms" class="rooms"></nav></aside><section class="main"><header class="top"><div><h2 id="roomTitle">설계팀 단체방</h2><small id="roomSub">팀원 7명</small></div><div style="display:flex;align-items:center;gap:12px"><small id="clock"></small><button id="logout" class="logout" type="button">나가기</button></div></header><div id="messages" class="messages"></div><form id="form" class="composer"><input id="message" autocomplete="off" maxlength="1000" placeholder="메시지를 입력하세요"><button>전송</button></form><div class="notice">자율주행 설계팀 | 개인 프로젝트</div></section></div><script>
const allowedId='blh0615';
const overlay=document.getElementById('loginOverlay');
const loginForm=document.getElementById('loginForm');
function showLogin(){overlay.style.display='grid';document.getElementById('loginId').focus()}
function enterApp(){overlay.style.display='none';try{sessionStorage.setItem('chat_project_session','yes')}catch(err){console.warn('세션 저장 불가',err)}}
loginForm.addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('loginId').value.trim();if(v!==allowedId){document.getElementById('loginError').textContent='설정된 사용자 아이디를 확인해주세요.';return}document.getElementById('loginError').textContent='';enterApp()});
document.getElementById('logout').addEventListener('click',()=>{try{sessionStorage.removeItem('chat_project_session')}catch(err){}showLogin()});
try{if(sessionStorage.getItem('chat_project_session')==='yes')enterApp()}catch(err){}
const me='백인헌';const people=[{name:'김도현',role:'책임연구원 · 팀장',initial:'김'},{name:'박준혁',role:'책임연구원',initial:'박'},{name:'이준호',role:'책임연구원',initial:'이'},{name:'최현우',role:'연구원',initial:'최'},{name:'정민수',role:'연구원',initial:'정'},{name:'한승우',role:'연구원',initial:'한'}];const rooms=[{id:'team',title:'자율주행 설계팀',subtitle:'7명 참여',initial:'팀'},...people.map(p=>({id:p.name,title:p.name,subtitle:p.role,initial:p.initial}))];const initial=[{sender:'김도현',text:'좋은 아침입니다. 오늘 설계 검토 사항은 이 방에서 공유해주세요.',time:'08:05'},{sender:'박준혁',text:'센서 브래킷 조립 간섭 검토 결과를 정리하고 있습니다.',time:'08:14'},{sender:'이준호',text:'CAD 수정본은 변경 이력과 함께 공유 부탁드립니다.',time:'08:21'},{sender:'최현우',text:'오후 설계 리뷰 전에 주요 이슈 확인하겠습니다.',time:'09:02'}];const key='autonomous_team_chat_v2';let data;try{data=JSON.parse(localStorage.getItem(key))||{}}catch{data={}}if(!data.team)data.team=[];let current='team';const el=id=>document.getElementById(id);const now=()=>new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});const save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch(err){console.warn('채팅 저장 실패:',err)}};function drawRooms(){el('rooms').innerHTML='';rooms.forEach(r=>{let b=document.createElement('button');b.className='room'+(r.id===current?' active':'');b.innerHTML='<span class="avatar"></span><span><strong></strong><small></small></span>';b.querySelector('.avatar').textContent=r.initial;b.querySelector('strong').textContent=r.title;b.querySelector('small').textContent=r.subtitle;b.onclick=()=>{current=r.id;render()};el('rooms').append(b)})}function render(){drawRooms();const room=rooms.find(r=>r.id===current);el('roomTitle').textContent=room.title;el('roomSub').textContent=room.subtitle;const box=el('messages');box.innerHTML='';(data[current]||[]).forEach(m=>{const d=document.createElement('div');d.className='msg'+(m.sender===me?' mine':'');const a=document.createElement('span');a.className='avatar';a.textContent=m.sender[0];const wrap=document.createElement('div');const sender=document.createElement('div');sender.className='sender';sender.textContent=m.sender;const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text;const stamp=document.createElement('div');stamp.className='stamp';stamp.textContent=m.time;wrap.append(sender,bubble,stamp);d.append(a,wrap);box.append(d)});if(!box.children.length){let d=document.createElement('div');d.className='empty';d.textContent='대화를 시작해보세요.';box.append(d)}box.scrollTop=box.scrollHeight}// Fictional conversation threads, used to simulate activity while the page was closed.
const threads=[
[['김도현','오늘 자율주행 센서 패키징 검토 일정 먼저 공유하겠습니다.'],['박준혁','전방 레이더 브래킷 간섭 체크는 오전 중 마무리하겠습니다.'],['최현우','조립 공차 확인한 뒤 체크리스트 업데이트하겠습니다.'],['김도현','좋습니다. 변경된 내용은 버전 번호까지 같이 남겨주세요.']],
[['이준호','카메라 하우징 주변 공간 검토하면서 케이블 라우팅도 확인해 주세요.'],['정민수','현재 모델에서는 우측 고정부 근처 여유 공간이 조금 부족합니다.'],['이준호','그 부분은 고정 위치 조정안 두 가지로 비교해 보죠.'],['한승우','비교용 캡처 정리해서 공유하겠습니다.']],
[['박준혁','어제 수정한 센서 브래킷 도면 검토하신 분 계신가요?'],['한승우','형상은 확인했고 체결부 공차는 추가 확인 중입니다.'],['박준혁','체결부 확인 끝나면 변경 이력도 함께 올려주세요.'],['한승우','네, 검토 결과 정리하겠습니다.']],
[['김도현','오후 설계 리뷰에서 다룰 주요 이슈가 있을까요?'],['최현우','레이더 장착 위치 변경 시 정비 접근성이 조금 걱정됩니다.'],['이준호','그 부분은 조립성과 함께 비교 검토해야겠습니다.'],['김도현','좋아요. 검토 항목에 추가하겠습니다.']],
[['정민수','센서 커버 고정점 검토 자료 업데이트했습니다.'],['박준혁','고정점 주변 진동 영향도 같이 체크하면 좋겠습니다.'],['정민수','해당 항목 추가해서 다시 정리하겠습니다.'],['최현우','확인되면 다음 리뷰에서 같이 보겠습니다.']],
[['한승우','CAD 공유 폴더의 최신 파일명 확인 부탁드립니다.'],['이준호','날짜와 리비전이 표시된 파일을 기준으로 보면 됩니다.'],['한승우','네, 이전 버전과 혼동되지 않도록 정리하겠습니다.'],['김도현','수고하셨습니다. 변경 사유도 기록해주세요.']]
];
function pad(n){return String(n).padStart(2,'0')}
function dateTime(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function appendSimulatedActivity(){
 const nowDate=new Date();
 let last=new Date(data._lastSimulatedAt||0);
 if(!Number.isFinite(last.getTime())||last.getTime()===0){last=new Date(nowDate);last.setDate(last.getDate()-2);last.setHours(8,0,0,0)}
 // Limit catch-up to the last 3 days, to avoid an excessively large browser history.
 const earliest=new Date(nowDate.getTime()-3*86400000);if(last<earliest)last=earliest;
 const startDay=new Date(last);startDay.setHours(0,0,0,0);
 const events=[];
 for(let day=new Date(startDay);day<=nowDate;day.setDate(day.getDate()+1)){
   const weekday=day.getDay();if(weekday===0||weekday===6)continue;
   const dayNumber=Math.floor(day.getTime()/86400000);
   const schedule=[8*60+12,9*60+35,11*60+5,13*60+20,15*60+10,17*60+25,19*60+5];
   schedule.forEach((minutes,slot)=>{
     const thread=threads[((dayNumber*7+slot)%threads.length+threads.length)%threads.length];
     thread.forEach(([sender,text],i)=>{
       const at=new Date(day);at.setHours(0,minutes+i*3,0,0);
       if(at>last&&at<=nowDate)events.push({sender,text,time:dateTime(at),_at:at.getTime()});
     });
   });
 }
 events.sort((a,b)=>a._at-b._at);
 const generated=events.map(({sender,text,time})=>({sender,text,time}));data.team=data._lastSimulatedAt?[...data.team,...generated]:[...generated,...data.team];
 data.team=data.team.slice(-350);data._lastSimulatedAt=nowDate.toISOString();save();
}
appendSimulatedActivity();
const replies=['확인했습니다. 설계 변경 사항을 정리해볼게요.','관련 도면 버전과 검토 항목을 함께 확인하면 좋겠습니다.','좋습니다. 간섭 여부와 조립성을 중심으로 살펴보겠습니다.','내용 공유 감사합니다. 다음 리뷰 때 같이 확인하죠.','확인 후 수정이 필요한 부분을 말씀드리겠습니다.'];
function respond(room){const h=new Date().getHours();if(h<8||h>=20)return;const person=room==='team'?people[Math.floor(Math.random()*people.length)]:people.find(p=>p.name===room);if(!person)return;const text=replies[Math.floor(Math.random()*replies.length)];setTimeout(()=>{(data[room]??=[]).push({sender:person.name,text,time:dateTime(new Date())});save();if(current===room)render()},1300+Math.random()*1800)}
// While open, periodically add new team discussion during business hours.
setInterval(()=>{const h=new Date().getHours(),day=new Date().getDay();if(h<8||h>=20||day===0||day===6)return;const thread=threads[Math.floor(Math.random()*threads.length)];const [sender,text]=thread[Math.floor(Math.random()*thread.length)];data.team.push({sender,text,time:dateTime(new Date())});data.team=data.team.slice(-350);data._lastSimulatedAt=new Date().toISOString();save();if(current==='team')render()},12*60*1000);
el('form').onsubmit=e=>{e.preventDefault();const input=el('message'),text=input.value.trim();if(!text)return;(data[current]??=[]).push({sender:me,text,time:dateTime(new Date())});save();input.value='';const r=current;render();respond(r)};function tick(){el('clock').textContent=new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,30000);render();
</script></body></html>
